<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBFD">
<title>FeeOne — Fee & Pricing Engine for Transaction Banking</title>
<meta name="description" content="Interactive reference and live calculators for a world-class transaction-banking fee engine: ECR, tiering, bundling, clubbing, trade finance and relationship revenue.">
<style>
:root{
  --ink:#0A0B16; --mute:#6B7080; --faint:#9AA0AE;
  --paper:#FBFBFD; --card:#FFFFFF; --line:#E7E8EF; --line2:#F0F1F6;
  --accent:#5B5BE8; --accent-ink:#4747C9; --wash:#F4F4FE;
  --good:#0E8A5F; --good-wash:#EAF6F0;
  --r:14px; --rs:10px;
  --shadow:0 1px 2px rgba(10,11,22,.04), 0 8px 24px rgba(10,11,22,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-ink);text-decoration:none}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(251,251,253,.82);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1060px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;height:54px}
.mark{display:flex;align-items:baseline;gap:8px;flex:none}
.mark b{font-size:17px;letter-spacing:-.02em}
.mark span{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav button{
  appearance:none;border:0;background:none;cursor:pointer;flex:none;
  font:inherit;font-size:13.5px;font-weight:500;color:var(--mute);
  padding:7px 12px;border-radius:999px;transition:color .15s,background .15s;
  white-space:nowrap;
}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:#fff;background:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
main{max-width:1060px;margin:0 auto;padding:28px 20px 80px}
section[role="tabpanel"]{display:none}
section[role="tabpanel"].on{display:block;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  section[role="tabpanel"].on{animation:none}
  *{transition:none!important}
}

/* ---------- hero ---------- */
.hero{padding:30px 0 8px}
.hero .strip{height:3px;width:64px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#00B3E3);margin-bottom:22px}
.hero h1{font-size:clamp(28px,5.4vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.12;max-width:18em}
.hero p.lede{margin-top:14px;font-size:clamp(15px,2.4vw,17px);color:var(--mute);max-width:42em}
.hero .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:28px}
.hero .stat b{display:block;font-size:24px;letter-spacing:-.02em}
.hero .stat span{font-size:12.5px;color:var(--mute)}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .sub{font-size:13px;color:var(--mute);margin-top:3px}
h2.sec{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:34px 0 6px}
p.secsub{color:var(--mute);font-size:14px;margin-bottom:16px;max-width:46em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}

/* ---------- segmented control ---------- */
.seg{display:inline-flex;background:var(--line2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{
  appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:13px;font-weight:500;color:var(--mute);padding:6px 13px;border-radius:8px;
  white-space:nowrap;transition:all .15s;
}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(10,11,22,.12);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- forms ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.02em;margin-bottom:5px}
.f input,.f select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:var(--rs);
  padding:9px 11px;font-variant-numeric:tabular-nums;
  transition:border-color .15s,box-shadow .15s;
}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,232,.14)}

/* ---------- resolution trace (signature) ---------- */
.trace{margin-top:18px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:#fff}
.trace .t-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--line2);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.trace .row{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-top:1px solid var(--line2);font-size:13.5px}
.trace .row .l{color:var(--ink)}
.trace .row .d{color:var(--faint);font-size:12px}
.trace .row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.trace .row.neg .v{color:var(--good)}
.trace .row.note{color:var(--mute);font-size:12.5px;background:var(--wash)}
.trace .row.total{border-top:1.5px solid var(--ink);padding:12px 14px}
.trace .row.total .l{font-weight:600}
.trace .row.total .v{font-size:18px;font-weight:700;letter-spacing:-.01em}
.trace .row.total.good .v{color:var(--good)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer;transition:background .12s}
.tbl tbody tr.click:hover{background:var(--wash)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line2);color:var(--mute)}
.pill.acc{background:var(--wash);color:var(--accent-ink)}
.pill.good{background:var(--good-wash);color:var(--good)}

/* ---------- precedence ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rung{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px;background:#fff}
.rung .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rung:first-child .n{background:var(--accent)}
.rung b{font-size:13.5px}
.rung span{font-size:12.5px;color:var(--mute)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin-top:12px}
.kv dt{color:var(--mute)}
.kv dd{font-weight:500}

footer{border-top:1px solid var(--line);margin-top:60px}
footer .inner{max-width:1060px;margin:0 auto;padding:22px 20px;font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.disc{font-size:12px;color:var(--faint);margin-top:10px}
@media(max-width:560px){
  .bar{padding:0 12px;gap:10px}
  main{padding:20px 14px 70px}
  .card{padding:16px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="mark"><b>FeeOne</b><span>Fee Engine</span></div>
    <nav role="tablist" aria-label="Sections" id="nav"></nav>
  </div>
</header>

<main id="main"></main>

<footer>
  <div class="inner">
    <div>FeeOne — consolidated build base · companion to the master document &amp; workbook</div>
    <div>All rates illustrative — not any institution's negotiated tariff</div>
  </div>
</footer>

<script>
/* ============================================================
   ENGINE — pure functions, verified against the master document
   (39 assertions: tiering, packages, clubbing, 4 ECR models,
    payments, pooling, structures, LC ×2, guarantee, loan, SCF)
   ============================================================ */
const FE = {};
FE.banded = function (vol, bands) {
  let total = 0; const lines = [];
  for (const b of bands) {
    const hi = b.to == null ? Infinity : b.to;
    const units = Math.max(0, Math.min(vol, hi) - b.from + 1);
    if (units > 0) { total += units * b.rate; lines.push({ units, rate: b.rate, amt: units * b.rate, from: b.from, to: b.to }); }
  }
  return { total, lines };
};
FE.tiered = function (vol, bands) {
  let rate = bands[0].rate;
  for (const b of bands) { const hi = b.to == null ? Infinity : b.to; if (vol >= b.from && vol <= hi) rate = b.rate; }
  return { total: vol * rate, rate };
};
FE.pkg = function (base, items) {
  let total = base; const lines = [];
  for (const it of items) {
    const over = Math.max(0, it.used - it.allowance);
    const amt = over * it.overage;
    total += amt; lines.push({ ...it, over, amt });
  }
  return { total, lines };
};
FE.club = function (vols, bands) {
  const per = vols.map(v => FE.banded(v, bands).total);
  const solo = per.reduce((a, b) => a + b, 0);
  const agg = vols.reduce((a, b) => a + b, 0);
  const clubbed = FE.banded(agg, bands).total;
  return { per, solo, agg, clubbed, saving: solo - clubbed };
};
FE.ecrReserve = function (collected, reserve, rate, days, basis, charges) {
  const investable = collected * (1 - reserve);
  const credit = investable * rate * days / basis;
  return { investable, credit, net: Math.max(0, charges - credit), unused: Math.max(0, credit - charges) };
};
FE.ecrSimple = function (balance, rate, charges) {
  const credit = balance * rate / 12;
  return { credit, net: Math.max(0, charges - credit), unused: Math.max(0, credit - charges) };
};
FE.ecrTiered = function (balance, tiers, days, basis) {
  let rem = balance, total = 0; const lines = [];
  for (const t of tiers) {
    const slice = t.size == null ? rem : Math.min(rem, t.size);
    if (slice <= 0) break;
    const amt = slice * t.rate * days / basis;
    total += amt; rem -= slice; lines.push({ slice, rate: t.rate, amt });
  }
  return { total, lines };
};
FE.ecrHybrid = function (threshold, balance, charges, ecr, intRate) {
  const allowance = threshold * ecr / 12;
  const offset = Math.min(allowance, charges);
  const payout = Math.max(0, allowance - offset);
  const interest = Math.max(0, balance - threshold) * intRate / 12;
  return { allowance, offset, payout, interest, clientValue: offset + payout + interest, net: Math.max(0, charges - allowance) };
};
FE.payments = function (p) {
  const lines = [
    { l: "ACH", d: p.ach.toLocaleString() + " × " + p.achRate, amt: p.ach * p.achRate },
    { l: "Domestic RTGS — electronic", d: p.rtgs + " × " + p.rtgsRate, amt: p.rtgs * p.rtgsRate },
    { l: "Repairs (non-STP surcharge)", d: p.repairs + " × " + p.repairRate, amt: p.repairs * p.repairRate },
    { l: "International — electronic", d: p.intlE + " × " + p.intlERate, amt: p.intlE * p.intlERate },
    { l: "International — manual", d: p.intlM + " × " + p.intlMRate, amt: p.intlM * p.intlMRate },
    { l: "Correspondent pass-through", d: (p.intlE + p.intlM) + " × " + p.corrRate, amt: (p.intlE + p.intlM) * p.corrRate },
  ];
  const total = lines.reduce((a, x) => a + x.amt, 0);
  const optim = p.intlM * (p.intlMRate - p.intlERate) + Math.floor(p.repairs / 2) * p.repairRate;
  return { lines, total, optim };
};
FE.pooling = function (offset, debit, credit, feeBps, admin, days, basis) {
  const benefit = offset * (debit - credit) * days / basis;
  const fee = offset * feeBps * days / basis + admin;
  return { benefit, fee, net: benefit - fee };
};
FE.structures = function (s) {
  const oneTime = s.structures * s.implPer + s.multibankSetup;
  const ongoing = s.domAccts * s.domRate + s.xbAccts * s.xbRate + s.reporting + s.portal + s.mbAccts * s.mbRate;
  return { oneTime, ongoing, monthOne: oneTime + ongoing };
};
FE.lc = function (face, ratePerPeriod, tenorMonths, periodMonths, handling, drawing, drawRate, discrepancy) {
  const periods = Math.ceil(tenorMonths / periodMonths);
  const commission = face * ratePerPeriod * periods;
  const drawFee = drawing * drawRate;
  return { periods, commission, drawFee, total: commission + handling + drawFee + discrepancy };
};
FE.lcMonthly = function (face, ratePerMonth, months, amendment, discrepant, reimb) {
  const commission = face * ratePerMonth * months;
  return { commission, total: commission + amendment + discrepant + reimb };
};
FE.guarantee = function (face, ratePerMonth, months, amendAmt, amendMonths, amendFee) {
  const base = face * ratePerMonth * months;
  const amend = amendAmt * ratePerMonth * amendMonths;
  return { base, amend, total: base + amend + amendFee };
};
FE.loan = function (principal, rate, days, arrRate) {
  const interest = principal * rate * days / 360;
  const arr = principal * arrRate;
  return { interest, arr, total: interest + arr };
};
FE.scf = function (invoice, daysEarly, rate) { return { total: invoice * rate * daysEarly / 360 }; };
</script>
<script>
/* ============================================================
   UI — formatters, tabs, sections, live wiring
   ============================================================ */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const num = new Intl.NumberFormat("en-US");
const fmt = v => usd.format(v);
const fmt0 = v => usd0.format(v);
const pct = v => (v * 100).toLocaleString("en-US", { maximumFractionDigits: 4 }) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- shared band table (wires) ---------- */
const WIRE_BANDS = [{ from: 1, to: 100, rate: 20 }, { from: 101, to: 500, rate: 15 }, { from: 501, to: null, rate: 10 }];

/* ---------- small builders ---------- */
function field(id, label, val, step) {
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" value="${val}" ${step ? `step="${step}"` : ""}></div>`;
}
function traceHTML(title, rows) {
  let h = `<div class="trace"><div class="t-head"><span>Resolution trace</span><span>${esc(title)}</span></div>`;
  for (const r of rows) {
    const cls = ["row", r.kind || ""].join(" ").trim();
    if (r.kind === "note") { h += `<div class="row note"><span>${esc(r.l)}</span></div>`; continue; }
    h += `<div class="${cls}"><span class="l">${esc(r.l)}${r.d ? ` <span class="d">${esc(r.d)}</span>` : ""}</span><span class="v">${r.v}</span></div>`;
  }
  return h + `</div>`;
}
function segHTML(id, opts, sel) {
  return `<div class="seg" role="tablist" id="${id}">` + opts.map((o, i) =>
    `<button role="tab" data-i="${i}" aria-selected="${i === sel}">${esc(o)}</button>`).join("") + `</div>`;
}
function wireSeg(id, onPick) {
  $("#" + id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", $("#" + id)).forEach(x => x.setAttribute("aria-selected", "false"));
    b.setAttribute("aria-selected", "true");
    onPick(+b.dataset.i);
  });
}
const V = id => { const x = parseFloat($("#" + id).value); return isFinite(x) ? x : 0; };
function onInputs(ids, fn) { ids.forEach(id => $("#" + id).addEventListener("input", fn)); fn(); }

/* ============================================================
   SECTIONS
   ============================================================ */
const TABS = [
  ["overview", "Overview"],
  ["ecr", "ECR"],
  ["bundles", "Bundles & Tiers"],
  ["liquidity", "Payments & Liquidity"],
  ["trade", "Trade & SCF"],
  ["cases", "Case Library"],
  ["revenue", "Revenue"],
  ["reference", "Reference"],
];

/* ---------- Overview ---------- */
function secOverview() {
  return `
  <div class="hero">
    <div class="strip"></div>
    <h1>One engine. Every fee, every balance, every relationship.</h1>
    <p class="lede">FeeOne is the build base for a world-class transaction-banking fee &amp; pricing engine — merging the public-record practices of Citi, J.P.&nbsp;Morgan, HSBC, Standard&nbsp;Chartered, Goldman&nbsp;TxB and Morgan&nbsp;Stanley with the capability bar set by Oracle&nbsp;ORMB, Zafin and Finacle. Every rule on this page is computed live by the same verified logic as the master document and workbook.</p>
    <div class="stats">
      <div class="stat"><b class="num">6</b><span>simultaneous pricing axes</span></div>
      <div class="stat"><b class="num">21</b><span>live business cases</span></div>
      <div class="stat"><b class="num">4</b><span>ECR models</span></div>
      <div class="stat"><b class="num">3–8%</b><span>fee income lost to leakage (vendor estimate)</span></div>
    </div>
  </div>

  <h2 class="sec">The six pricing axes</h2>
  <p class="secsub">Every charge is a point in this six-dimensional space. The engine resolves each axis from configuration — never code — then prices and explains the event.</p>
  <div class="grid g3">
    ${[
      ["Scope", "Who is charged?", "Group · entity · division · account · account-group · virtual account · product · transaction"],
      ["Event", "Which action?", "Payment, return, repair, amendment, investigation, statement, LC issuance, sweep, lockbox item"],
      ["Balance", "Which balances modify it?", "Collected · investable (reserve-adjusted) · overdraft · compensating · threshold · surplus"],
      ["Time", "What temporal basis?", "One-time · monthly · daily accrual · per-month/quarter commission · part-period proration"],
      ["Channel", "How was it executed?", "Electronic / API vs manual / assisted · STP vs repaired · correspondent pass-through"],
      ["Relationship", "What benefits apply?", "Bundles · tiers · rebates · waivers · ECR offset · commitments · total-wallet deals"],
    ].map(a => `<div class="card"><div class="eyebrow">${a[0]}</div><h3>${a[1]}</h3><p class="sub">${a[2]}</p></div>`).join("")}
  </div>

  <h2 class="sec">Pricing precedence — most specific wins</h2>
  <p class="secsub">With prices attachable at many levels, a deterministic stack guarantees exactly one resolved price and one explanation per event.</p>
  <div class="ladder">
    ${[
      ["Client-specific negotiated deal", "“Global Treasury 2026”: wires $12 flat across all entities"],
      ["Relationship / entity bundle", "Entity A on the ‘Payments Plus’ package"],
      ["Account package", "Account 123 on a ‘Premium Operating’ plan"],
      ["Product-country tariff", "USD wire standard tariff for the U.S."],
      ["Event default", "Catalogue default unit rate"],
    ].map((r, i) => `<div class="rung"><div class="n num">${i + 1}</div><div><b>${r[0]}</b><br><span>${r[1]}</span></div></div>`).join("")}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Benefit-stacking modes</h3>
      <dl class="kv">
        <dt>Additive</dt><dd>Discounts sum (10% bundle + 5% loyalty = 15%)</dd>
        <dt>Best-of</dt><dd>Only the single most favourable benefit applies</dd>
        <dt>Selected-events</dt><dd>Benefit applies only to named services</dd>
        <dt>Exclusive</dt><dd>Benefits cannot co-apply; precedence selects one</dd>
      </dl>
    </div>
    <div class="card"><h3>Every resolution emits</h3>
      <dl class="kv">
        <dt>Rate</dt><dd>The resolved price</dd>
        <dt>Provenance</dt><dd>Winning layer + rule version</dd>
        <dt>Stacking</dt><dd>The mode applied</dd>
        <dt>Bounds</dt><dd>Any floor / cap / minimum that bound it</dd>
        <dt>Explanation</dt><dd>Plain-language “why this fee applied”</dd>
      </dl>
    </div>
  </div>

  <h2 class="sec">What the leading banks signal</h2>
  <div class="grid g2">
    ${[
      ["Citi", "Global Pricing Engine across 90+ markets; ECR pegged to the 90-day T-bill with no carry-forward; DACA implementation, legal and monthly fees; online vs manual wire differential — one contract holds event, setup, administered-account and balance pricing."],
      ["J.P. Morgan", "Earnings-credit allowance offsets balance-compensable charges; a formal service-code taxonomy; Brazilian balances incorporated into a Global ECR structure — cross-country balance aggregation is a real requirement."],
      ["HSBC", "Hybrid Checking: ECR threshold offsets fees, unused credits are paid back, and balances above the threshold earn credit interest — ECR cannot stop at “net fee floored at zero.”"],
      ["Standard Chartered", "The most explicit public tariff: manual vs electronic, correspondent pass-through, structure-level liquidity fees, and balance-formula pricing (higher of flat or balance × central-bank deposit rate)."],
      ["Goldman Sachs TxB", "API-first and cloud-native: real-time visibility, self-service price transparency, event-level metering, virtual integrated accounts."],
      ["Morgan Stanley", "Reserve portfolios, MMFs and reporting for $10m+ balances — reserve-investment services may need a separate fee book within one relationship."],
    ].map(b => `<div class="card"><h3>${b[0]}</h3><p class="sub">${b[1]}</p></div>`).join("")}
  </div>
  <p class="disc">Figures throughout are illustrative, constructed to demonstrate engine mechanics — not any institution's current negotiated tariff.</p>`;
}

/* ---------- ECR ---------- */
function secECR() {
  return `
  <h2 class="sec">Earnings Credit Rate — four live models</h2>

  });

const SECTIONS = { overview: secOverview, ecr: secECR, bundles: secBundles, liquidity: secLiquidity, trade: secTrade, cases: secCases, revenue: secRevenue, reference: secReference };
const WIRERS = { ecr: wireECR, bundles: wireBundles, liquidity: wireLiquidity, trade: wireTrade, revenue: wireRevenue };
const built = {};

function show(tab) {
  $$("#nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $$('section[role="tabpanel"]').forEach(s => s.classList.toggle("on", s.id === "sec-" + tab));
  if (!built[tab]) {
    $("#sec-" + tab).innerHTML = SECTIONS[tab]();
    if (WIRERS[tab]) WIRERS[tab]();
    if (tab === "cases") {
      $("#sec-cases").addEventListener("click", e => {
        const tr = e.target.closest("tr.click");
        if (tr) { show(tr.dataset.tab); window.scrollTo({ top: 0, behavior: "smooth" }); location.hash = tr.dataset.tab; }
      });
    }
    built[tab] = true;
  }
  const nb = $(`#nav button[data-tab="${tab}"]`);
  if (nb && nb.scrollIntoView) nb.scrollIntoView({ block: "nearest", inline: "center" });
}

(function init() {
  const nav = $("#nav"), main = $("#main");
  for (const [id, label] of TABS) {
    const b = document.createElement("button");
    b.role = "tab"; b.dataset.tab = id; b.textContent = label;
    b.addEventListener("click", () => { show(id); location.hash = id; });
    nav.appendChild(b);
    const s = document.createElement("section");
    s.id = "sec-" + id; s.setAttribute("role", "tabpanel");
    main.appendChild(s);
  }
  const start = (location.hash || "").slice(1);
  show(SECTIONS[start] ? start : "overview");
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (SECTIONS[h]) show(h);
  });
})();
